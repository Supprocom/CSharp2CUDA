name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CSHARP2CUDA_PACKAGE_VERSION: 0.3.2

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Supprocom.CSharp2CUDA.slnx

      - name: Verify formatting and analyzers
        run: >-
          dotnet format Supprocom.CSharp2CUDA.slnx
          --verify-no-changes --no-restore --severity warn

      - name: Build without warnings
        run: >-
          dotnet build Supprocom.CSharp2CUDA.slnx
          --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test Supprocom.CSharp2CUDA.slnx
          --configuration Release --no-build
          --logger "console;verbosity=minimal"

      - name: Pack exact source
        run: |
          dotnet pack Supprocom.CSharp2CUDA/Supprocom.CSharp2CUDA.csproj \
            --configuration Release --no-restore \
            --output artifacts/package \
            -p:RepositoryCommit=$GITHUB_SHA \
            -p:RepositoryBranch=$GITHUB_REF_NAME \
            -p:ContinuousIntegrationBuild=true
          dotnet pack Supprocom.CSharp2CUDA.Tool/Supprocom.CSharp2CUDA.Tool.csproj \
            --configuration Release --no-restore \
            --output artifacts/package \
            -p:RepositoryCommit=$GITHUB_SHA \
            -p:RepositoryBranch=$GITHUB_REF_NAME \
            -p:ContinuousIntegrationBuild=true

      - name: Verify package build integration
        env:
          CSHARP2CUDA_RUN_DIRECTORY: ${{ runner.temp }}/CSharp2CUDA
        run: >-
          dotnet run --project Supprocom.CSharp2CUDA.PackageTests.Verify
          --configuration Release --no-build --
          package
          --package-directory artifacts/package
          --run-directory "$CSHARP2CUDA_RUN_DIRECTORY"
          --package-version "$CSHARP2CUDA_PACKAGE_VERSION"
          --expected-commit "$GITHUB_SHA"
          --expected-branch "$GITHUB_REF_NAME"

      - name: Verify installed tool
        env:
          CSHARP2CUDA_RUN_DIRECTORY: ${{ runner.temp }}/CSharp2CUDA
        run: >-
          dotnet run --project Supprocom.CSharp2CUDA.PackageTests.Verify
          --configuration Release --no-build --
          tool
          --package-directory artifacts/package
          --run-directory "$CSHARP2CUDA_RUN_DIRECTORY"
          --package-version "$CSHARP2CUDA_PACKAGE_VERSION"

      - name: Verify exact-package source suite
        env:
          CSHARP2CUDA_RUN_DIRECTORY: ${{ runner.temp }}/CSharp2CUDA
        run: >-
          dotnet run --project Supprocom.CSharp2CUDA.PackageTests.Verify
          --configuration Release --no-build --
          source-suite
          --package-directory artifacts/package
          --run-directory "$CSHARP2CUDA_RUN_DIRECTORY"
          --package-version "$CSHARP2CUDA_PACKAGE_VERSION"
          --results-directory "$CSHARP2CUDA_RUN_DIRECTORY/package-source-tests/trx"

      - name: Retain exact packages and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: CSharp2CUDA-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/package
            ${{ runner.temp }}/CSharp2CUDA/**/evidence
            ${{ runner.temp }}/CSharp2CUDA/**/trx
