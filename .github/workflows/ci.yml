name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CSharp2CUDA.slnx

      - name: Verify formatting and analyzers
        run: >-
          dotnet format CSharp2CUDA.slnx
          --verify-no-changes --no-restore --severity warn

      - name: Build without warnings
        run: >-
          dotnet build CSharp2CUDA.slnx
          --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test CSharp2CUDA.slnx
          --configuration Release --no-build
          --logger "console;verbosity=minimal"

      - name: Pack exact source
        run: >-
          dotnet pack CSharp2CUDA/CSharp2CUDA.csproj
          --configuration Release --no-restore
          --output artifacts/package
          -p:RepositoryCommit=$GITHUB_SHA
          -p:RepositoryBranch=$GITHUB_REF_NAME
